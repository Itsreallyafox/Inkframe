# /etc/NetworkManager/conf.d/99-inkframe-wifi.conf (installed by install.sh --system)
#
# The Pi Zero 2 W's Wi-Fi chip drops off the network after a while with the
# driver's power saving on (it dozes, misses beacons, and the frame becomes
# unreachable while it keeps running).  2 = disable power saving for every
# connection whose own wifi.powersave is "default"; install.sh also sets it on
# the active profile so it applies without a reboot.
[connection]
wifi.powersave=2
