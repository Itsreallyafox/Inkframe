<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Inkframe">
  <meta name="format-detection" content="telephone=no">
  <title>Inkframe</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='5.5' width='29' height='21' rx='2.5' fill='%23f4f3ee' stroke='%2318181a' stroke-width='2'/%3E%3Crect x='6.25' y='9.25' width='6' height='6' fill='%2318181a'/%3E%3Crect x='13.5' y='9.75' width='5' height='5' fill='%23ffffff' stroke='%2318181a'/%3E%3Crect x='19.75' y='9.25' width='6' height='6' fill='%23e4c638'/%3E%3Crect x='6.25' y='16.75' width='6' height='6' fill='%23ba3028'/%3E%3Crect x='13' y='16.75' width='6' height='6' fill='%23243a82'/%3E%3Crect x='19.75' y='16.75' width='6' height='6' fill='%23347a54'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/playfair-display/PlayfairDisplay-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/now" aria-label="Inkframe, now showing">
        <span class="swatches" aria-hidden="true"><i class="sw-black"></i><i class="sw-white"></i><i class="sw-yellow"></i><i class="sw-red"></i><i class="sw-blue"></i><i class="sw-green"></i></span>
        <span class="brand-name">Inkframe</span>
      </a>
      <span class="conn" data-conn data-state="pending"><i class="conn-dot"></i><span class="conn-label">Connecting</span></span>
    </header>

    <nav class="nav" aria-label="Main">
      <a class="brand brand-rail" href="#/now" aria-label="Inkframe, now showing">
        <span class="swatches" aria-hidden="true"><i class="sw-black"></i><i class="sw-white"></i><i class="sw-yellow"></i><i class="sw-red"></i><i class="sw-blue"></i><i class="sw-green"></i></span>
        <span class="brand-name">Inkframe</span>
      </a>
      <ul class="nav-list">
        <li><a href="#/now" data-tab="now"><span data-icon="now"></span><span class="nav-label">Now</span></a></li>
        <li><a href="#/photos" data-tab="photos"><span data-icon="photos"></span><span class="nav-label">Photos</span></a></li>
        <li><a href="#/rotation" data-tab="rotation"><span data-icon="rotation"></span><span class="nav-label">Rotation</span></a></li>
        <li><a href="#/apps" data-tab="apps"><span data-icon="apps"></span><span class="nav-label">Apps</span></a></li>
        <li><a href="#/settings" data-tab="settings"><span data-icon="settings"></span><span class="nav-label">Settings</span></a></li>
      </ul>
      <div class="nav-foot">
        <span class="conn" data-conn data-state="pending"><i class="conn-dot"></i><span class="conn-label">Connecting</span></span>
        <span class="nav-host" data-host></span>
      </div>
    </nav>

    <main id="view" class="view" tabindex="-1">
      <noscript><p class="noscript">Inkframe needs JavaScript to run its controls.</p></noscript>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="confirm" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <div class="dialog-body">
      <img class="dialog-thumb" data-image width="600" height="400" alt="" hidden>
      <h2 id="confirm-title" class="dialog-title" data-title></h2>
      <p id="confirm-text" class="dialog-text" data-message></p>
      <div class="dialog-actions">
        <button type="button" class="btn" data-cancel>Cancel</button>
        <button type="button" class="btn btn-primary" data-ok>OK</button>
      </div>
    </div>
  </dialog>
</body>
</html>
